<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaMeS</title>
    <style>
        /* This is CSS - it controls how your website looks */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #04af8a;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: rgb(5, 165, 194);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
       .profile-img {
           width: 100%;          
           max-width: 500px;     
           height: auto;         
           border-radius: 8px;   
           margin-top: 20px;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-style: italic;
            margin-bottom: 30px;
        }
        .cta-btn {
            display: inline-greee;
            background-color: #0070f3;
            color: blue;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .cta-btn:hover {
            background-color: #0051bb;
        }
    
        nav {
            background-color: #1a1a1a;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .logo-link {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-logo {
            height: 40px;
            width: auto;
            display: block;
            align-self: center;
        }
        .nav-links {
            margin-left: auto;
        }
        .nav-links a {
            color: rgb(243, 0, 0);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .nav-links a:hover {
            color: #0070f3;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
<nav>
    <!-- Centered navigation logo -->
    <a href="index.html" class="logo-link">
        <img src="Logo.png" alt="Logo" class="nav-logo">
    </a>
    
    <!-- Navigation Links on the right side -->
    <div class="nav-links">
        <a href="index.html">Main</a>
        <a href="about.html">about</a>
    </div>
</nav>


    <!-- Main Content Container -->
    <div class="container">
        <!-- Placeholder Image -->
        <img src="profile.png" alt="Profile Picture" class="profile-img">

        
        <h1>لمن انته فارغ وتريد تسوي موقع الكتروني</h1>
      
   
      
</body>
</html>
